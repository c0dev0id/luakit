name: Run Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      test_debian:
        description: 'Test on Debian'
        type: boolean
        default: false
      test_arch:
        description: 'Test on Arch Linux'
        type: boolean
        default: false
      test_alpine:
        description: 'Test on Alpine Linux'
        type: boolean
        default: false
      test_void:
        description: 'Test on Void Linux'
        type: boolean
        default: false
      test_gentoo:
        description: 'Test on Gentoo Linux'
        type: boolean
        default: false
      test_freebsd:
        description: 'Test on FreeBSD'
        type: boolean
        default: false
      test_openbsd:
        description: 'Test on OpenBSD'
        type: boolean
        default: false
jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          luajit \
          libluajit-5.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglib2.0-dev \
          lua-check \
          lua-luassert \
          lua-filesystem \
          lua-socket \
          xvfb \
          xauth \
          dbus-x11
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests

  freebsd:
    if: github.event_name == 'workflow_dispatch' && inputs.test_freebsd
    name: FreeBSD
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Test on FreeBSD
      uses: cross-platform-actions/action@v0.24.0
      with:
        operating_system: freebsd
        version: '14.0'
        shell: bash
        run: |
          sudo pkg install -y \
            gmake \
            pkgconf \
            luajit \
            gtk3 \
            webkit2-gtk4 \
            libsoup3 \
            glib2 \
            lua51-luafilesystem \
            lua51-luasocket \
            sqlite3 \
            xorg-vfbserver \
            dbus
            gmake \
            pkgconf \
            luajit \
            gtk3 \
            webkit2-gtk3 \
            lua51-luafilesystem \
            lua51-luasocket \
            xorg-vfbserver \
            dbus

  openbsd:
    if: github.event_name == 'workflow_dispatch' && inputs.test_openbsd
    name: OpenBSD
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Test on OpenBSD
      uses: cross-platform-actions/action@v0.24.0
      with:
        operating_system: openbsd
        version: '7.4'
        shell: bash
        run: |
          sudo pkg_add \
            gmake \
            luajit \
            gtk+3 \
            webkitgtk41 \
            sqlite3 \
            glib2 \
            luafilesystem \
            luasocket
            gmake \
            luajit \
            gtk+3 \
            webkit \
            luafilesystem \
            lua-socket

  debian:
    if: github.event_name == 'workflow_dispatch' && inputs.test_debian
    name: Debian Stable
    runs-on: ubuntu-latest
    container: debian:stable
    
    steps:
    - name: Install git
      run: |
        apt-get update
        apt-get install -y git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          luajit \
          libluajit-5.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglib2.0-dev \
          lua-check \
          lua-luassert \
          lua-filesystem \
          lua-socket \
          xvfb \
          xauth \
          dbus-x11
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests

  arch:
    if: github.event_name == 'workflow_dispatch' && inputs.test_arch
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    steps:
    - name: Install git
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          luajit \
          gtk3 \
          webkit2gtk-4.1 \
          sqlite \
          lua51-filesystem \
          lua51-socket \
          xorg-server-xvfb \
          dbus
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests

  alpine:
    if: github.event_name == 'workflow_dispatch' && inputs.test_alpine
    name: Alpine Linux
    runs-on: ubuntu-latest
    container: alpine:latest
    
    steps:
    - name: Install git
      run: apk add --no-cache git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        apk add --no-cache \
          build-base \
          luajit-dev \
          gtk+3.0-dev \
          webkit2gtk-4.1-dev \
          glib-dev \
          lua5.1-filesystem \
          lua5.1-socket \
          xvfb-run \
          dbus \
          bash
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: |
        if command -v busted >/dev/null 2>&1; then
          xvfb-run -a make run-tests
        else
          echo "Warning: busted not available on Alpine, skipping tests"
        fi

  void:
    if: github.event_name == 'workflow_dispatch' && inputs.test_void
    name: Void Linux
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-linux:latest-full-x86_64
    
    steps:
    - name: Install git
      run: xbps-install -Syu xbps && xbps-install -y git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        xbps-install -Sy \
          base-devel \
          LuaJIT-devel \
          gtk+3-devel \
          webkit2gtk-devel \
          glib-devel \
          lua51-filesystem \
          lua51-socket \
          xorg-server-xvfb \
          dbus
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests

  gentoo:
    if: github.event_name == 'workflow_dispatch' && inputs.test_gentoo
    name: Gentoo Linux
    runs-on: ubuntu-latest
    container: gentoo/stage3:latest
    timeout-minutes: 120
    
    steps:
    - name: Sync Portage and install git
      run: |
        emerge-webrsync
        emerge --ask=n dev-vcs/git
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure git safe directory
      run: git config --global --add safe.directory /__w/luakit/luakit
      
    - name: Install dependencies
      run: |
        emerge --ask=n \
          dev-lang/luajit \
          x11-libs/gtk+:3 \
          net-libs/webkit-gtk:4.1 \
          dev-libs/glib \
          dev-lua/luafilesystem \
          dev-lua/luasocket \
          x11-base/xorg-server \
          sys-apps/dbus
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: |
        Xvfb :99 -screen 0 1024x768x24 &
        export DISPLAY=:99
        sleep 2
        make run-tests
