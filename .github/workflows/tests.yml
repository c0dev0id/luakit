name: Run Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          luajit \
          libluajit-5.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglib2.0-dev \
          lua-check \
          lua-luassert \
          lua-filesystem \
          lua-socket \
          xvfb \
          xauth \
          dbus-x11
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests
