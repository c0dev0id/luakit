name: Cross Distribution Check

on:
  workflow_dispatch:

jobs:
  debian:
    name: Debian Stable
    runs-on: ubuntu-latest
    container: debian:stable
    
    steps:
    - name: Install git
      run: |
        apt-get update
        apt-get install -y git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libsqlite3-dev \
          lua5.1 \
          liblua5.1-0-dev \
          luajit \
          libluajit-5.1-dev \
          lua-filesystem \
          xvfb \
          xauth \
          dbus-x11 \
          lua-busted \
          lua5.1-luassert
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    steps:
    - name: Install git
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          gtk3 \
          webkit2gtk-4.1 \
          sqlite \
          lua51 \
          luajit \
          lua51-filesystem \
          xorg-server-xvfb \
          dbus \
          lua-busted \
          lua51-luassert
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests

  alpine:
    name: Alpine Linux
    runs-on: ubuntu-latest
    container: alpine:latest
    
    steps:
    - name: Install git
      run: apk add --no-cache git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        apk add --no-cache \
          build-base \
          gtk+3.0-dev \
          webkit2gtk-4.1-dev \
          sqlite-dev \
          lua5.1-dev \
          luajit-dev \
          lua5.1-filesystem \
          xvfb-run \
          dbus \
          bash
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: |
        if command -v busted >/dev/null 2>&1; then
          xvfb-run -a make run-tests
        else
          echo "Warning: busted not available on Alpine, skipping tests"
        fi

  void:
    name: Void Linux
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-linux:latest-full-x86_64
    
    steps:
    - name: Install git
      run: xbps-install -Syu xbps && xbps-install -y git
    
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        xbps-install -Sy \
          base-devel \
          gtk+3-devel \
          webkit2gtk-devel \
          sqlite-devel \
          lua51-devel \
          LuaJIT-devel \
          lua51-filesystem \
          xorg-server-xvfb \
          dbus \
          lua51-busted
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests
